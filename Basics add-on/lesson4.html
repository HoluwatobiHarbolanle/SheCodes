<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grids</title>
    <style>

        img{
            width: 250px;
            border-radius: 15px;
        }

        .image-gallery{
            width: 1000px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: 250px 250px 250px 250px;
            grid-gap: 10px;
        }
    </style>
</head>

<body>
    <div class="image-gallery">
        <img src="./Images/artist-painting.jpg" alt="Image of an artist painting">

        <img src="./Images/artist-painting.jpg" alt="Image of an artist painting">

        <img src="./Images/artist-painting.jpg" alt="Image of an artist painting">

        <img src="./Images/artist-painting.jpg" alt="Image of an artist painting">
        
        <img src="./Images/singer.jpg" alt="A lady singing">

        <img src="./Images/singer.jpg" alt="A lady singing">

        <img src="./Images/singer.jpg" alt="A lady singing">

        <img src="./Images/singer.jpg" alt="A lady singing">
        
    </div>
</body>
</html>
